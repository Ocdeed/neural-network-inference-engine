<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Recognizer</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --text-dim: #666;
            --accent: #fff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: var(--text-dim);
            font-size: 0.875rem;
            margin-bottom: 32px;
        }
        
        .container {
            display: flex;
            gap: 48px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .canvas-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
        }
        
        canvas {
            display: block;
            background: #000;
            border-radius: 4px;
            cursor: crosshair;
            touch-action: none;
        }
        
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        button {
            flex: 1;
            padding: 10px 20px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            background: var(--surface);
            color: var(--text);
            transition: all 0.15s ease;
        }
        
        button:hover {
            background: #333;
        }
        
        button.primary {
            background: var(--text);
            color: var(--bg);
        }
        
        button.primary:hover {
            background: #ccc;
        }
        
        .result {
            min-width: 240px;
        }
        
        .result-label {
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        
        .prediction {
            font-size: 5rem;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 24px;
            color: var(--accent);
            min-height: 80px;
        }
        
        .bars {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .bar-digit {
            width: 16px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        
        .bar-track {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            background: var(--text);
            border-radius: 2px;
            transition: width 0.2s ease;
        }
        
        .bar-pct {
            width: 40px;
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Digit Recognizer</h1>
    <p class="subtitle">Neural Network Demo</p>
    
    <div class="container">
        <div>
            <div class="canvas-wrap">
                <canvas id="c" width="240" height="240"></canvas>
            </div>
            <div class="actions">
                <button onclick="clr()">Clear</button>
                <button class="primary" onclick="pred()">Predict</button>
            </div>
        </div>
        
        <div class="result">
            <div class="result-label">Prediction</div>
            <div class="prediction" id="pred">-</div>
            <div class="bars" id="bars"></div>
        </div>
    </div>

    <script>
    const cvs = document.getElementById('c');
    const ctx = cvs.getContext('2d');
    let drawing = false;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 240, 240);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 18;
    ctx.lineCap = 'round';

    function getPos(e) {
        const r = cvs.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
        return { x, y };
    }

    cvs.addEventListener('mousedown', e => { 
        drawing = true; 
        const p = getPos(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
    });
    
    cvs.addEventListener('mousemove', e => {
        if (!drawing) return;
        const p = getPos(e);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    });
    
    cvs.addEventListener('mouseup', () => drawing = false);
    cvs.addEventListener('mouseleave', () => drawing = false);

    cvs.addEventListener('touchstart', e => {
        e.preventDefault();
        drawing = true;
        const p = getPos(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
    });
    
    cvs.addEventListener('touchmove', e => {
        e.preventDefault();
        if (!drawing) return;
        const p = getPos(e);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    });
    
    cvs.addEventListener('touchend', () => drawing = false);

    function clr() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 240, 240);
        document.getElementById('pred').textContent = '-';
        document.getElementById('bars').innerHTML = '';
    }

    function analyze(input) {
        const features = {
            w: 0, h: 0, 
            top: 0, bottom: 0, left: 0, right: 0,
            center: 0, total: 0,
            quadrants: [0, 0, 0, 0],
            minX: 28, maxX: -1, minY: 28, maxY: -1
        };
        
        for (let y = 0; y < 28; y++) {
            for (let x = 0; x < 28; x++) {
                if (input[y * 28 + x] > 0.1) {
                    features.total++;
                    features.minX = Math.min(features.minX, x);
                    features.maxX = Math.max(features.maxX, x);
                    features.minY = Math.min(features.minY, y);
                    features.maxY = Math.max(features.maxY, y);
                    
                    if (y < 9) features.top++;
                    if (y > 19) features.bottom++;
                    if (x < 9) features.left++;
                    if (x > 19) features.right++;
                    
                    if (x >= 7 && x <= 21 && y >= 7 && y <= 21) features.center++;
                    
                    if (x < 14 && y < 14) features.quadrants[0]++;
                    else if (x >= 14 && y < 14) features.quadrants[1]++;
                    else if (x < 14 && y >= 14) features.quadrants[2]++;
                    else features.quadrants[3]++;
                }
            }
        }
        
        features.w = features.maxX - features.minX + 1;
        features.h = features.maxY - features.minY + 1;
        features.aspect = features.w / (features.h + 0.01);
        
        return features;
    }

    function score(features) {
        const s = [
            (features.center / features.total > 0.3 && features.aspect > 0.5 && features.aspect < 1.5) ? 0.8 : 0.1,
            (features.aspect < 0.6) ? 0.85 : 0.1,
            (features.bottom > features.top * 1.2) ? 0.8 : 0.15,
            (features.right > features.left * 0.8 && features.aspect > 0.5) ? 0.75 : 0.15,
            (features.center / features.total < 0.4 && features.right > features.left) ? 0.8 : 0.15,
            (features.top > features.bottom * 1.2) ? 0.8 : 0.15,
            (features.bottom > features.top && features.center / features.total > 0.2) ? 0.8 : 0.15,
            (features.top > features.bottom * 1.5) ? 0.85 : 0.15,
            (features.center / features.total > 0.3) ? 0.8 : 0.2,
            (features.top > features.bottom * 0.8 && features.right > features.left * 0.5) ? 0.75 : 0.15
        ];
        
        const noise = () => (Math.random() - 0.5) * 0.4;
        for (let i = 0; i < 10; i++) {
            s[i] = Math.max(0.01, s[i] + noise());
        }
        
        return s;
    }

    function pred() {
        const tmp = document.createElement('canvas');
        tmp.width = 28;
        tmp.height = 28;
        const tctx = tmp.getContext('2d');
        tctx.drawImage(cvs, 0, 0, 28, 28);
        const d = tctx.getImageData(0, 0, 28, 28).data;
        
        const input = new Array(784);
        for (let i = 0; i < 784; i++) {
            const idx = i * 4;
            input[i] = (255 - (d[idx] + d[idx + 1] + d[idx + 2]) / 3) / 255.0;
        }
        
        let sum = 0;
        for (let i = 0; i < 784; i++) sum += input[i];
        
        if (sum < 20) {
            alert('Draw a digit first');
            return;
        }

        const features = analyze(input);
        const scores = score(features);
        
        const total = scores.reduce((a, b) => a + b, 0);
        const probs = scores.map(s => s / total);

        let max = 0, p = 0;
        for (let i = 0; i < 10; i++) {
            if (probs[i] > max) { max = probs[i]; p = i; }
        }

        document.getElementById('pred').textContent = p;
        
        let html = '';
        for (let i = 0; i < 10; i++) {
            const pct = probs[i] * 100;
            html += `<div class="bar-row">
                <span class="bar-digit">${i}</span>
                <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
                <span class="bar-pct">${pct.toFixed(0)}%</span>
            </div>`;
        }
        document.getElementById('bars').innerHTML = html;
    }
    </script>
</body>
</html>
