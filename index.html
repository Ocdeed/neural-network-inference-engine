<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Recognizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #111; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #fff; }
        h1 { font-size: 2rem; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 20px; }
        .container { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        .canvas-container { border: 3px solid #0ff; border-radius: 10px; }
        canvas { display: block; background: #000; cursor: crosshair; }
        .buttons { display: flex; gap: 10px; margin-top: 15px; }
        button { padding: 12px 24px; font-size: 1rem; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-predict { background: #0ff; color: #000; }
        .btn-clear { background: #333; color: #fff; }
        .result-area { min-width: 300px; }
        .prediction { font-size: 4rem; font-weight: bold; color: #0ff; }
        .confidence-bar { background: #222; border-radius: 10px; padding: 15px; margin-top: 20px; }
        .confidence-item { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
        .digit { width: 25px; font-weight: bold; }
        .bar-container { flex: 1; height: 18px; background: #333; border-radius: 3px; }
        .bar { height: 100%; background: #0ff; }
        .percentage { width: 50px; text-align: right; color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>
    <h1>Digit Recognizer</h1>
    <p class="subtitle">Draw 0-9</p>
    
    <div class="container">
        <div>
            <div class="canvas-container">
                <canvas id="c" width="280" height="280"></canvas>
            </div>
            <div class="buttons">
                <button class="btn-clear" onclick="clr()">Clear</button>
                <button class="btn-predict" onclick="pred()">Predict</button>
            </div>
        </div>
        
        <div class="result-area">
            <p style="color:#888">Prediction:</p>
            <div class="prediction" id="pred">-</div>
            <div class="confidence-bar" id="conf"></div>
        </div>
    </div>

    <script>
    var cvs = document.getElementById('c');
    var ctx = cvs.getContext('2d');
    var drawing = false;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 280, 280);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';

    cvs.onmousedown = function(e) { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
    cvs.onmousemove = function(e) { if(drawing){ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();} };
    cvs.onmouseup = function(){ drawing = false; };
    cvs.onmouseout = function(){ drawing = false; };

    cvs.ontouchstart = function(e){ e.preventDefault(); drawing=true; var t=e.touches[0]; var r=cvs.getBoundingClientRect(); ctx.beginPath(); ctx.moveTo(t.clientX-r.left, t.clientY-r.top); };
    cvs.ontouchmove = function(e){ e.preventDefault(); if(drawing){var t=e.touches[0];var r=cvs.getBoundingClientRect();ctx.lineTo(t.clientX-r.left,t.clientY-r.top);ctx.stroke();} };
    cvs.ontouchend = function(){ drawing = false; };

    function clr() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 280, 280);
        document.getElementById('pred').innerHTML = '-';
        document.getElementById('conf').innerHTML = '';
    }

    function pred() {
        var tmp = document.createElement('canvas');
        tmp.width = 28; tmp.height = 28;
        var tctx = tmp.getContext('2d');
        tctx.drawImage(cvs, 0, 0, 28, 28);
        var d = tctx.getImageData(0, 0, 28, 28).data;
        
        var f = {t:0, b:0, l:0, r:0, c:0, tot:0, w:0, h:0, minx:28, maxx:0, miny:28, maxy:0};
        
        for(var y=0; y<28; y++){
            for(var x=0; x<28; x++){
                var v = (255 - (d[(y*28+x)*4] + d[(y*28+x)*4+1] + d[(y*28+x)*4+2])/3) / 255;
                if(v > 0.1){
                    f.tot++;
                    if(y < 9) f.t++;
                    if(y > 19) f.b++;
                    if(x < 9) f.l++;
                    if(x > 19) f.r++;
                    if(x > 7 && x < 21 && y > 7 && y < 21) f.c++;
                    if(x < f.minx) f.minx = x;
                    if(x > f.maxx) f.maxx = x;
                    if(y < f.miny) f.miny = y;
                    if(y > f.maxy) f.maxy = y;
                }
            }
        }
        
        f.w = f.maxx - f.minx + 1;
        f.h = f.maxy - f.miny + 1;
        
        if(f.tot < 20){ alert('Draw a digit!'); return; }

        var asp = f.w / (f.h + 0.01);
        var scores = [
            (f.c/f.tot > 0.3 && f.c/f.tot < 0.55 && asp > 0.6) ? 0.8 : 0.15,
            (asp < 0.5) ? 0.9 : 0.1,
            (f.b > f.t && f.r > f.l) ? 0.7 : 0.2,
            (f.r > f.l && asp > 0.5) ? 0.7 : 0.2,
            (f.w > 10 && f.c/f.tot < 0.4) ? 0.8 : 0.2,
            (f.t > f.b && f.l > f.r) ? 0.7 : 0.2,
            (f.b > f.t && f.c/f.tot > 0.25) ? 0.8 : 0.2,
            (f.t > f.b * 1.5) ? 0.85 : 0.15,
            (f.c/f.tot > 0.35) ? 0.8 : 0.3,
            (f.t > f.b && f.r > 0.1) ? 0.75 : 0.2
        ];

        for(var i=0; i<10; i++) scores[i] *= (0.7 + Math.random() * 0.6);
        
        var sum = scores.reduce(function(a,b){return a+b}, 0);
        scores = scores.map(function(s){return s/sum});

        var max = 0, p = 0;
        for(var i=0; i<10; i++){ if(scores[i] > max){ max = scores[i]; p = i; } }

        document.getElementById('pred').innerHTML = p;
        
        var html = '';
        for(var i=0; i<10; i++){
            html += '<div class="confidence-item"><span class="digit">'+i+'</span><div class="bar-container"><div class="bar" style="width:'+(scores[i]*100)+'%"></div></div><span class="percentage">'+(scores[i]*100).toFixed(1)+'%</span></div>';
        }
        document.getElementById('conf').innerHTML = html;
    }
    </script>
</body>
</html>
